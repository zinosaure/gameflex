<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphes — GameFlex</title>
<!--
    Outil de DÉV, servi par le middleware `dev-graphs` du serveur webpack
    (webpack.config.js, devServer.setupMiddlewares) à /dev/graphs. Il affiche
    docs/graphs/*.md, monté en lecture seule : le markdown reste la source, et
    se lit aussi sur GitHub. marked et Mermaid viennent de jsDelivr, versions
    épinglées — sans réseau, la page montre le texte brut.
-->
<style>
:root {
    --ground: #eef0f4; --surface: #fff; --surface-2: #f6f7fa;
    --ink: #15181e; --ink-2: #3f4652; --muted: #6a7280;
    --hairline: #d8dce4; --hairline-2: #e6e9ef;
    --accent: #b4501f; --accent-soft: #f6ece6;
    --note: #8a6108; --note-soft: #f8f0dc;
    --focus: #1f6feb;
}
@media (prefers-color-scheme: dark) {
    :root {
        --ground: #12151a; --surface: #191d24; --surface-2: #1f242c;
        --ink: #e9ecf1; --ink-2: #bcc3cf; --muted: #8b93a1;
        --hairline: #2c323c; --hairline-2: #242a33;
        --accent: #e2823f; --accent-soft: #2a1d14;
        --note: #d9a63c; --note-soft: #272012;
        --focus: #5b9dff;
    }
}
* { box-sizing: border-box; }
body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.6 "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
}
.shell { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
.side {
    position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
    padding: 28px 18px; border-right: 1px solid var(--hairline); background: var(--surface);
}
.brand { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 18px; }
nav a {
    display: block; padding: 8px 10px; border-radius: 7px; color: var(--ink-2);
    text-decoration: none; font-size: 14px; line-height: 1.35; border-left: 3px solid transparent;
}
nav a:hover { background: var(--surface-2); color: var(--ink); }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
nav a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.src { font: 11px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 22px; }
main { padding: 34px clamp(18px, 4vw, 56px) 96px; max-width: 1180px; }
main h1 { font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -0.02em; line-height: 1.15; margin: 0 0 12px; text-wrap: balance; }
main h2 { font-size: 20px; margin: 38px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
main h3 { font-size: 16px; margin: 26px 0 8px; }
main p, main li { max-width: 78ch; color: var(--ink-2); }
main a { color: var(--accent); text-underline-offset: 3px; }
main code { font: .88em ui-monospace, Menlo, monospace; background: var(--surface-2); border: 1px solid var(--hairline-2); border-radius: 4px; padding: .5px 4px; }
main pre:not(.mermaid) { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
main pre code { background: none; border: 0; padding: 0; }
main table { border-collapse: collapse; margin: 12px 0; font-size: 14px; display: block; overflow-x: auto; max-width: 100%; }
main th, main td { border: 1px solid var(--hairline); padding: 6px 10px; text-align: left; vertical-align: top; }
main th { background: var(--surface-2); }
main blockquote { margin: 14px 0; padding: 10px 14px; border-left: 3px solid var(--note); background: var(--note-soft); border-radius: 0 8px 8px 0; }
main blockquote p { margin: 4px 0; color: var(--ink); }
.diagram { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 16px; margin: 16px 0 22px; overflow-x: auto; }
.diagram svg { max-width: none; height: auto; }
.diagram .err { color: var(--accent); font: 12px ui-monospace, Menlo, monospace; white-space: pre-wrap; }
.boot { color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
@media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--hairline); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="shell">
    <aside class="side">
        <div class="brand">Graphes</div>
        <p class="hint">Comment GameFlex parle, flux par flux — et ce qu'on pourrait fusionner.</p>
        <nav id="nav" aria-label="Flux"></nav>
        <p class="src">source : docs/graphs/</p>
    </aside>
    <main id="main"><p class="boot">Lecture de /dev/graphs/list…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(function () {
    "use strict";

    var BASE = "/dev/graphs";
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var hasMarked = typeof window.marked !== "undefined";
    var hasMermaid = typeof window.mermaid !== "undefined";
    var DOCS = [];

    if (hasMermaid) {
        window.mermaid.initialize({
            startOnLoad: false,
            theme: dark ? "dark" : "neutral",
            securityLevel: "strict",
            sequence: { showSequenceNumbers: true, mirrorActors: false, wrap: true },
            flowchart: { curve: "basis" }
        });
    }

    function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function json(r) {
        if (!r.ok) { return r.text().then(function (t) { throw new Error(t || ("HTTP " + r.status)); }); }
        return r.json();
    }

    function toHtml(md) {
        if (!hasMarked) {
            return "<p class=\"boot\">marked n'a pas pu être chargé (pas de réseau ?) — texte brut :</p><pre>" + esc(md) + "</pre>";
        }
        var renderer = new window.marked.Renderer();
        var plainCode = renderer.code.bind(renderer);
        renderer.code = function (code, lang) {
            if (String(lang || "").trim() === "mermaid") {
                return "<div class=\"diagram\"><pre class=\"mermaid\">" + esc(code) + "</pre></div>";
            }
            return plainCode(code, lang);
        };
        return window.marked.parse(md, { renderer: renderer, gfm: true });
    }

    function current() {
        var file = decodeURIComponent((location.hash || "").slice(1));
        return DOCS.some(function (d) { return d.file === file; }) ? file : (DOCS[0] && DOCS[0].file);
    }

    function paintNav(file) {
        document.querySelectorAll("#nav a").forEach(function (a) {
            if (a.dataset.file === file) { a.setAttribute("aria-current", "page"); } else { a.removeAttribute("aria-current"); }
        });
    }

    function show(file) {
        var main = document.getElementById("main");
        if (!file) { main.innerHTML = "<p class=\"boot\">docs/graphs est vide.</p>"; return; }
        paintNav(file);
        fetch(BASE + "/doc?file=" + encodeURIComponent(file)).then(function (r) {
            if (!r.ok) { throw new Error("HTTP " + r.status); }
            return r.text();
        }).then(function (md) {
            main.innerHTML = toHtml(md);
            /* Les liens entre graphes restent dans la page ; la liste vivante
               s'ouvre dans sa propre page. */
            main.querySelectorAll("a[href]").forEach(function (a) {
                var href = a.getAttribute("href");
                if (/^https?:/.test(href)) { return; }
                if (/reste-a-faire\.md/.test(href)) { a.setAttribute("href", "/dev/checklist"); return; }
                var m = href.match(/([\w.-]+\.md)(#.*)?$/);
                if (m && DOCS.some(function (d) { return d.file === m[1]; })) { a.setAttribute("href", "#" + m[1]); }
            });
            document.title = (DOCS.find(function (d) { return d.file === file; }) || {}).title + " — Graphes";
            window.scrollTo(0, 0);
            if (!hasMermaid) { return; }
            var nodes = main.querySelectorAll("pre.mermaid");
            nodes.forEach(function (node, i) {
                var source = node.textContent;
                window.mermaid.render("g" + Date.now() + i, source).then(function (out) {
                    var holder = document.createElement("div");
                    holder.innerHTML = out.svg;
                    var svg = holder.firstElementChild;
                    /* Mermaid rend un SVG « largeur 100 %, largeur maximale naturelle » :
                       un grand diagramme est alors réduit à la largeur de la page, jusqu'à
                       l'illisible. Taille naturelle, et c'est le cadre qui défile. */
                    var natural = parseFloat(svg.style.maxWidth);
                    if (natural) {
                        svg.setAttribute("width", natural);
                        svg.style.maxWidth = "none";
                    }
                    node.replaceWith(svg);
                })["catch"](function (e) {
                    node.outerHTML = "<p class=\"err\">Diagramme illisible par Mermaid : " + esc(e.message || e) + "</p><pre>" + esc(source) + "</pre>";
                });
            });
        })["catch"](function (e) {
            main.innerHTML = "<p class=\"boot\">Impossible de lire " + esc(file) + " — " + esc(e.message) + "</p>";
        });
    }

    fetch(BASE + "/list").then(json).then(function (docs) {
        DOCS = docs;
        var nav = document.getElementById("nav");
        docs.forEach(function (d) {
            var a = document.createElement("a");
            a.href = "#" + d.file;
            a.dataset.file = d.file;
            a.textContent = d.title;
            nav.appendChild(a);
        });
        show(current());
    })["catch"](function (e) {
        document.getElementById("main").innerHTML = "<p class=\"boot\">Impossible de lire la liste — " + esc(e.message) + "</p>";
    });
    window.addEventListener("hashchange", function () { show(current()); });
})();
</script>
</body>
</html>
