# Configuration xemu minimale pour le conteneur (seedée dans
# ~/.local/share/xemu/xemu/ au premier boot, jamais écrasée ensuite).
# Les chemins BIOS pointent vers le mount read-only /opt/xbox/bios.
# L'EEPROM reste dans le data dir (volume persistant).

[general]
show_welcome = false
first_run = false

[sys.files]
bootrom_path = "/opt/xbox/bios/mcpx_1.0.bin"
flashrom_path = "/opt/xbox/bios/Complex_4627.bin"
eeprom_path = "/root/.local/share/xemu/xemu/eeprom.bin"
hdd_path = "/opt/xbox/bios/xbox_hdd.qcow2"
